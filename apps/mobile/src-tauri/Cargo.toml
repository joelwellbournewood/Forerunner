[package]
name = "forerunner-mobile"
version = "1.0.0-rc.2"
description = "Forerunner Android shell"
authors = ["Forerunner contributors"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "forerunner_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
# Device identity (ADR 0009, ADR 0032): Ed25519 in pure Rust; the seed is wrapped by the
# Android Keystore (Kotlin plugin) at rest and never leaves the process.
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
base64 = "=0.22.1"
# fr:// pairing links (the QR the desktop shows opens the app).
tauri-plugin-deep-link = "=2.6.0"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# The platform biometric prompt behind `assert_biometric`, and the QR scanner for pairing.
tauri-plugin-biometric = "=2.4.0"
tauri-plugin-barcode-scanner = "=2.5.0"
