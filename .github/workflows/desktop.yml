name: Desktop app

on:
  pull_request:
    paths: ["apps/**", "packages/**", "testenv/src/bench/**", "testenv/src/provider/**", "scripts/*runtime-payload*", "scripts/installed-check.*", "scripts/desktop-window-check.*", "evals/registry/**", ".github/workflows/desktop.yml"]
  # Development branches too: the Playwright UI tests and the installed-app check run before a
  # release, and every push leaves installers the owner can try (docs/setup-guide.md, "Trying a
  # build before it is released"). The concurrency group cancels an older run of the same branch.
  push:
    branches: [main, "claude/**"]
    paths: ["apps/**", "packages/**", "testenv/src/bench/**", "testenv/src/provider/**", "scripts/*runtime-payload*", "scripts/installed-check.*", "scripts/desktop-window-check.*", "evals/registry/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: tauri build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev
      - run: pnpm install --frozen-lockfile
      - name: UI unit tests
        run: pnpm --filter @forerunner/ui test
      - name: Approvals web unit tests (jsdom, fake state service on 127.0.0.1)
        run: pnpm --filter @forerunner/approvals-web test
      - name: Playwright browser (Chromium) for the UI tests
        run: pnpm --filter @forerunner/ui exec playwright install chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}
      - name: Playwright UI tests
        run: pnpm --filter @forerunner/ui test:ui
      - name: Rust format (desktop shell)
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Rust lint (desktop shell)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust unit tests (desktop shell)
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Tauri build (unsigned unless secrets are present)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @forerunner/desktop tauri build --ci
      # The installers carry the runtime (ADR 0092; tauri.conf.json's beforeBuildCommand builds it
      # into src-tauri/runtime/): start it the way the shell does and check it answers.
      - name: Bundled runtime starts on its own (scripts/runtime-payload-smoke.mjs)
        run: node scripts/runtime-payload-smoke.mjs
      # The real installer, installed where users put it (another drive, spaces and non-ASCII
      # letters, a long path, read-only, a network share; the .deb in /usr/lib and the AppImage
      # from an odd folder) and started with --self-test the way a normal launch does (ADR 0092).
      - name: Installed app check (scripts/installed-check.*)
        shell: bash
        run: |
          b=apps/desktop/src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -File scripts/installed-check.ps1 -Msi "$(ls $b/msi/*.msi | head -n 1)"
          else
            bash scripts/installed-check.sh "$(ls $b/deb/*.deb | head -n 1)" "$(ls $b/appimage/*.AppImage | head -n 1)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  # The installed app's own window (phase F2; docs/maintainers/testing.md, "The desktop window
  # check"). Every walk drove the UI in Chromium, but the shell opens links, files and windows its
  # own way (the owner's "Clicking PR does nothing" was a shell-only bug). This installs the MSI the
  # build job made, starts it as a person does with WebView2's DevTools on and its daemon on the
  # stand-in model, drives the window over CDP through the core journey (Set up later, New project
  # with a one-line brief, the plan card, Approve and start, the session, the Tasks tab), then reads
  # from the shell's own log what it did with the PR link, Settings' "Get Docker Desktop" link, a
  # target="_blank" link, a file: link and Open folder. Every run of this workflow runs it (about
  # 6 to 10 minutes after the build); the screenshots and logs are the job's artifact.
  window:
    name: desktop window check (windows-latest)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-latest
          path: ${{ runner.temp }}/installer
      - name: Install the MSI where a person does (Program Files)
        shell: pwsh
        run: |
          $msi = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'installer') -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "no .msi in the build job's artifact" }
          $log = Join-Path $env:RUNNER_TEMP 'window-install.log'
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/l*v', "`"$log`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content -LiteralPath $log -Tail 40; throw "msiexec exit $($p.ExitCode)" }
          $dir = Join-Path $env:ProgramFiles 'Forerunner'
          $exe = Get-ChildItem -LiteralPath $dir -Filter *.exe -File | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw "no .exe in $dir" }
          "FR_APP_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # A data folder with a space and non-ASCII letters: the project folder Open folder hands to
      # Explorer has both.
      - name: Drive the installed app's window (scripts/desktop-window-check.mjs)
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP ('fr window\Z' + [char]0x00FC + 'rich home')
          node scripts/desktop-window-check.mjs --exe "$env:FR_APP_EXE" --home "$data" --out (Join-Path $env:RUNNER_TEMP 'window-check')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-window-check
          path: ${{ runner.temp }}/window-check
          if-no-files-found: warn
