name: Desktop app

on:
  pull_request:
    paths: ["apps/**", "packages/**", "scripts/*runtime-payload*", "scripts/installed-check.*", "evals/registry/**", ".github/workflows/desktop.yml"]
  # Development branches too: the Playwright UI tests and the installed-app check run before a
  # release, and every push leaves installers the owner can try (docs/setup-guide.md, "Trying a
  # build before it is released"). The concurrency group cancels an older run of the same branch.
  push:
    branches: [main, "claude/**"]
    paths: ["apps/**", "packages/**", "scripts/*runtime-payload*", "scripts/installed-check.*", "evals/registry/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: tauri build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev
      - run: pnpm install --frozen-lockfile
      - name: UI unit tests
        run: pnpm --filter @forerunner/ui test
      - name: Approvals web unit tests (jsdom, fake state service on 127.0.0.1)
        run: pnpm --filter @forerunner/approvals-web test
      - name: Playwright browser (Chromium) for the UI tests
        run: pnpm --filter @forerunner/ui exec playwright install chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}
      - name: Playwright UI tests
        run: pnpm --filter @forerunner/ui test:ui
      - name: Rust format (desktop shell)
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Rust lint (desktop shell)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust unit tests (desktop shell)
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Tauri build (unsigned unless secrets are present)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @forerunner/desktop tauri build --ci
      # The installers carry the runtime (ADR 0092; tauri.conf.json's beforeBuildCommand builds it
      # into src-tauri/runtime/): start it the way the shell does and check it answers.
      - name: Bundled runtime starts on its own (scripts/runtime-payload-smoke.mjs)
        run: node scripts/runtime-payload-smoke.mjs
      # The real installer, installed where users put it (another drive, spaces and non-ASCII
      # letters, a long path, read-only, a network share; the .deb in /usr/lib and the AppImage
      # from an odd folder) and started with --self-test the way a normal launch does (ADR 0092).
      - name: Installed app check (scripts/installed-check.*)
        shell: bash
        run: |
          b=apps/desktop/src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -File scripts/installed-check.ps1 -Msi "$(ls $b/msi/*.msi | head -n 1)"
          else
            bash scripts/installed-check.sh "$(ls $b/deb/*.deb | head -n 1)" "$(ls $b/appimage/*.AppImage | head -n 1)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
