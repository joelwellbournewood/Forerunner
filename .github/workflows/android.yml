name: Android app

on:
  pull_request:
    paths: ["apps/**", "packages/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: tauri android build + emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The SDK repository no longer carries the legacy "tools" package the action installs by default.
          packages: platform-tools
      - name: Install NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Android keystore (generated when no secret is set)
        run: node scripts/android-keystore.mjs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Tauri android build (apk, x86_64 for the emulator + arm64 for phones)
        run: pnpm --filter @forerunner/mobile tauri android build --apk --target x86_64 --target aarch64 --ci
      - name: Free disk space for the emulator (the APK build leaves under 4 GB; the emulator needs 1.8 x disk-size)
        run: |
          df -h / | tail -1
          # The NDK and the Rust build directory stay: e2e/run.mjs builds the debug x86_64 APK for the
          # emulator in the next step and needs both (run 5 removed them and the debug build failed).
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/CodeQL"
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
          ls -l /dev/kvm || echo "no /dev/kvm on this runner"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator UI and sync tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # An automated-test-device image on API 30 boots in minutes on the 2-core hosted
          # runner; the API 34 google_apis image never reached boot_completed in 10 minutes.
          api-level: 30
          arch: x86_64
          target: aosp_atd
          ram-size: 3072M
          disk-size: 4096M
          emulator-boot-timeout: 1200
          # -accel on fails loudly when KVM is unusable instead of hanging; -verbose shows the boot.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -accel on -verbose
          disable-animations: true
          script: pnpm --filter @forerunner/mobile test:emulator
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
