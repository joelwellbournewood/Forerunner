name: CI

on:
  pull_request:
  push:
    branches: [main, "claude/**", "ccr-**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1
  PNPM_VERSION: 10.28.0

jobs:
  check-linux:
    name: check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: forerunner
          POSTGRES_DB: forerunner_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FORERUNNER_TEST_PG: postgres://postgres:forerunner@localhost:5432/forerunner_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint && pnpm lint:paths
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (fake provider, no network)
        run: pnpm test:unit
      - name: App tests (UI and approvals web, jsdom)
        run: pnpm --filter @forerunner/ui test && pnpm --filter @forerunner/approvals-web test
      - name: Integration tests (stand-ins)
        run: pnpm test:integration
      - name: Phase 3 and 4 gate harnesses and the nine scenarios (fake provider)
        run: pnpm exec vitest run --project e2e tests/e2e/scenarios
      - name: Live harness offline tests (ledger, budget, metered provider, dry run; live cases skip)
        run: pnpm --filter @forerunner/live test
      - name: Prompt-injection suite (browser and email paths)
        run: pnpm test:injection
      - name: Secret scan (repo and test logs)
        run: pnpm secrets:scan && pnpm secrets:scan --logs
      - name: Docs check
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm docs:check --base origin/${{ github.base_ref }}
      - name: Link check
        run: pnpm docs:links
      - name: Schema doc is current
        run: |
          pnpm docs:schema
          git diff --exit-code -- docs/maintainers/data-model.md || (echo "::error::docs/maintainers/data-model.md is stale; run pnpm docs:schema" && exit 1)
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-ubuntu
          path: |
            .forerunner-dev/**/*.log
            test-results/
          if-no-files-found: ignore

  check-windows:
    name: check (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Start preinstalled PostgreSQL
        shell: pwsh
        run: |
          $svc = Get-Service -Name "postgresql*" | Select-Object -First 1
          if ($svc) { Set-Service -Name $svc.Name -StartupType Manual; Start-Service -Name $svc.Name }
          else { & "$env:PGBIN\pg_ctl.exe" -D "$env:PGDATA" -w start }
          $env:PGPASSWORD = "root"
          & "$env:PGBIN\psql.exe" -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE forerunner_test;" -c "ALTER USER postgres PASSWORD 'forerunner';" postgres
          "FORERUNNER_TEST_PG=postgres://postgres:forerunner@localhost:5432/forerunner_test" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (fake provider, no network)
        run: pnpm test:unit
      - name: Integration tests (stand-ins)
        run: pnpm test:integration
      - name: Phase 3 and 4 gate harnesses and the nine scenarios (fake provider)
        run: pnpm exec vitest run --project e2e tests/e2e/scenarios
      - name: Live harness offline tests (ledger, budget, metered provider, dry run; live cases skip)
        run: pnpm --filter @forerunner/live test
      - name: Prompt-injection suite (browser and email paths)
        run: pnpm test:injection
      - name: Secret scan (repo and test logs)
        run: pnpm secrets:scan && pnpm secrets:scan --logs
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows
          path: |
            .forerunner-dev/**/*.log
            test-results/
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (high and critical fail)
        run: pnpm audit --audit-level high

  sandbox-image:
    name: sandbox and runner image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runner image (also the sandbox image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/cloud-runner/Dockerfile
          push: false
          load: true
          tags: forerunner-runner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: docker run --rm forerunner-runner:ci node -e "console.log('runner image ok', process.version)"
