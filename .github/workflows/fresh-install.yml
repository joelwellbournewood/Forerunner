name: Fresh install timing

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths: ["scripts/fresh-install.*", ".github/workflows/fresh-install.yml"]

jobs:
  install:
    name: fresh install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Scripted fresh install must finish setup in under 15 minutes
        shell: bash
        run: |
          start=$(date +%s)
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -File scripts/fresh-install.ps1 -NonInteractive
          else
            bash scripts/fresh-install.sh --non-interactive
          fi
          end=$(date +%s)
          dur=$((end-start))
          echo "fresh install took ${dur}s" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$dur" -lt 900
