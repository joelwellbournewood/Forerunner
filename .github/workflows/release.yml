name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v1.0.0)
        required: true

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev
      - run: pnpm install --frozen-lockfile
      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pnpm --filter @forerunner/desktop tauri build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*
            apps/desktop/src-tauri/target/release/bundle/appimage/*
            apps/desktop/src-tauri/target/release/bundle/deb/*

  android:
    name: android apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - run: pnpm install --frozen-lockfile
      - run: node scripts/android-keystore.mjs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: pnpm --filter @forerunner/mobile tauri android build --apk --ci
      - name: Verify the release APK signature (apksigner; an unsigned or debug-signed APK fails the job)
        run: node scripts/android-apk-verify.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  runner-image:
    name: runner image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/cloud-runner/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/forerunner-runner:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/forerunner-runner:latest

  publish:
    name: GitHub release
    needs: [desktop, android, runner-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums and release notes
        run: |
          cd artifacts && find . -type f -exec sha256sum {} \; > SHA256SUMS.txt && cd ..
          node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > RELEASE_NOTES.md
      - name: Signed release manifest (ADR 0015; skipped without UPDATE_SIGNING_KEY)
        if: env.UPDATE_SIGNING_KEY != ''
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          channel=stable; case "$tag" in *-*) channel=beta;; esac
          pick() { find artifacts -type f -name "$1" | head -n 1; }
          args=()
          f=$(pick '*.msi');      [ -n "$f" ] && args+=(--artifact "windows-x64:$f")
          f=$(pick '*.AppImage'); [ -n "$f" ] && args+=(--artifact "linux-x64:$f")
          f=$(pick '*.apk');      [ -n "$f" ] && args+=(--artifact "android:$f")
          node scripts/release-notes.mjs "$tag" --changelog CHANGELOG.md > notes-section.md
          keyfile=$(mktemp); printf '%s' "$UPDATE_SIGNING_KEY" > "$keyfile"
          pnpm exec tsx packages/runtime/src/cli/main.ts update manifest \
            --version "$version" --channel "$channel" --notes-file notes-section.md --min-schema 1 \
            --base-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}" \
            "${args[@]}" --out manifest.json
          pnpm exec tsx packages/runtime/src/cli/main.ts update sign \
            --manifest manifest.json --key-file "$keyfile" --out artifacts/forerunner-release.json
          rm -f "$keyfile" manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*
            docs/user-guide.md
            docs/setup-guide.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
